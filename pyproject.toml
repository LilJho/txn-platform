[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "txn-platform"
version = "0.1.0"
description = "Lending transaction data platform: loans, charges, discounts -> S3 -> warehouse -> ML"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jhonnel Garcia" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "faker>=25.0"]
aws = ["boto3>=1.34"]
warehouse = ["duckdb>=1.0", "snowflake-connector-python[pandas]>=3.10"]
ml = ["scikit-learn>=1.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/txn_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]